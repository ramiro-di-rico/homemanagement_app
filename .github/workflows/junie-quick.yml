name: Junie quick task
on:
  issues:
    types: [labeled]

concurrency:
  group: junie-quick-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  quick:
    if: github.event.label.name == 'junie:quick'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve branch
        id: state
        run: |
          branch="quick/$(printf '%03d' "$ISSUE")-issue"
          # Re-adding the label on an existing branch continues that work
          # (the issue comments are part of the context below).
          # The branch of a first run is created after Junie, in the commit step.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git checkout "$branch"
            base="$branch"
          else
            base="${{ github.event.repository.default_branch }}"
          fi
          {
            echo "branch=$branch"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

      - name: Build issue context
        id: ctx
        run: |
          gh issue view "$ISSUE" --json title,body,comments --jq '
            "# " + .title + "\n\n" + (.body // "") + "\n\n## Comments\n" +
            ([.comments[]
              | select(.authorAssociation == "OWNER" or (.author.login | test("github-actions")))
              | "- @" + .author.login + ": " + .body] | join("\n"))
          ' > "$RUNNER_TEMP/issue.md"
          delim="EOF_$(openssl rand -hex 8)"
          { echo "context<<$delim"; cat "$RUNNER_TEMP/issue.md"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: JetBrains/junie-github-action@v1
        id: junie
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          silent_mode: true
          # The action resets the checkout to base_branch before running Junie,
          # so an existing quick branch has to be named here to be kept.
          base_branch: ${{ steps.state.outputs.base }}
          prompt: |
            IMPORTANT: this is an unattended CI run. You are in EXECUTION
            mode: do NOT enter Plan Mode and do NOT propose a plan for
            approval. Write the files directly to disk with your edit tools.
            Finishing without having made the requested changes, or without a
            final summary message, is a failure.

            This is a small, self-contained task. Do exactly what the issue
            below asks, in a single pass, with the smallest change that fully
            does it.

            - Work in the current checkout. Do NOT create or switch git
              branches and do NOT commit or push; the workflow creates the
              branch (${{ steps.state.outputs.branch }}), commits and opens
              the PR afterwards.
            - Follow JUNIE.md and AGENTS.md at the repo root and match the
              surrounding code. Never hand-edit lib/l10n/app_localizations*.dart:
              edit the .arb files and run flutter gen-l10n.
            - Do NOT create Spec Kit artifacts (no specs/ folder, no spec.md,
              plan.md or tasks.md).
            - Do NOT modify anything under .github/workflows.
            - Before finishing, run flutter pub get, flutter analyze and
              flutter test, and fix what your change broke. Run
              flutter gen-l10n if you edited any .arb file. If something
              cannot be built or tested in this environment, say so in the
              summary instead of claiming it passed.
            - If the task is ambiguous or needs a decision from the user, do
              not guess: make no changes and end your summary with a numbered
              list of specific questions.
            - Finish with a short summary: what changed, how it was verified,
              and anything the reviewer should double-check.

            ISSUE START
            ${{ steps.ctx.outputs.context }}
            ISSUE END

      - name: Commit, open PR and comment
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
          TITLE: ${{ github.event.issue.title }}
          SUMMARY: ${{ steps.junie.outputs.junie_summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN can never push workflow changes, so never stage them.
          git add -A -- . ':!.github/workflows'
          # Junie runs on the base branch: a first run creates the work branch
          # from here (the changes come along); a re-run lands on it already.
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "$BRANCH" ]; then
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              if ! git diff --cached --quiet; then
                git stash push -q
                git checkout "$BRANCH"
                git stash pop -q
              else
                git checkout "$BRANCH"
              fi
            else
              git checkout -b "$BRANCH"
            fi
          fi
          git add -A -- . ':!.github/workflows'
          pr_url=""
          if ! git diff --cached --quiet; then
            git commit -m "quick: $TITLE (#$ISSUE)"
            git push -u origin "$BRANCH"
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            pr_url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
            if [ -z "$pr_url" ]; then
              {
                echo "Closes #$ISSUE"
                echo
                printf '%s\n' "$SUMMARY"
              } > "$RUNNER_TEMP/pr.md"
              gh pr create --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr.md"
              pr_url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
            fi
          fi
          {
            echo "### Junie · quick task"
            echo
            printf '%s\n' "$SUMMARY"
            echo
            if [ -n "$pr_url" ]; then
              echo "PR: $pr_url"
              echo
              echo "**Next step:** review and merge the PR. To iterate, comment on this issue and re-add the label \`junie:quick\`."
            else
              echo "No changes were made. Answer any questions above in a comment and re-add the label \`junie:quick\`."
            fi
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          # Removing the label lets it be added again to re-run.
          gh issue edit "$ISSUE" --remove-label "junie:quick" 2>/dev/null || true
